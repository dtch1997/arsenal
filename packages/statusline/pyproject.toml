[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statusline"
version = "0.1.0"
description = "Claude Code status line renderer: reads the harness's stdin JSON, prints a colored one-line status (model, context bar, cost). Stdlib only; extend by adding segments."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Tan" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
claude-statusline = "statusline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/statusline"]
