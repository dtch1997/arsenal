[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gazette"
version = "0.1.0"
description = "Consumer-mode PR flow: nightly lane-respecting merge sweep (auto/delay/blocked) plus morning patch notes, so Daniel reads what happened instead of reviewing every PR."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Tan" }]
dependencies = [
    "flare @ git+https://github.com/dtch1997/arsenal#subdirectory=packages/flare",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gazette = "gazette.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gazette"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
flare = { workspace = true }
